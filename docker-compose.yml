version: "3.9"

services:
  app:
    build: .
    container_name: carxpert
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      # أضف متغيرات البيئة هنا مثل:
      # DATABASE_URL=postgresql://user:password@db:5432/carxpert
      # SESSION_SECRET=your_secret_here
    restart: unless-stopped
